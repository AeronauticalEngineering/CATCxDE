<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOR Review - ระบบตรวจสอบ TOR และหลักฐานประกอบ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h1, h2, h3, .font-prompt {
      font-family: 'Prompt', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Main Container -->
  <div class="max-w-4xl w-full mx-auto px-4 py-6 sm:py-8 flex-1">
    
    <!-- Header & Summary Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 mb-6">
      <div class="flex items-start justify-between gap-4 mb-5">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900">TOR Review</h1>
          <p class="text-sm text-slate-500 mt-0.5">ระบบตรวจสอบข้อกำหนดและหลักฐานประกอบจาก Google Drive</p>
        </div>
        <button id="btnRefresh" onclick="fetchTorData()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-50 text-blue-600 hover:bg-blue-100 transition">
          <i class="bi bi-arrow-clockwise"></i> รีเฟรชข้อมูล
        </button>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-3 divide-x divide-slate-100 text-center py-2 mb-5">
        <div>
          <div id="statTotalTor" class="font-prompt text-2xl sm:text-3xl font-bold text-slate-900">-</div>
          <div class="text-xs sm:text-sm text-slate-500 mt-1">TOR ทั้งหมด</div>
        </div>
        <div>
          <div id="statTotalImages" class="font-prompt text-2xl sm:text-3xl font-bold text-slate-900">-</div>
          <div class="text-xs sm:text-sm text-slate-500 mt-1">รูปภาพ</div>
        </div>
        <div>
          <div id="statReviewed" class="font-prompt text-2xl sm:text-3xl font-bold text-slate-900">-/-</div>
          <div class="text-xs sm:text-sm text-slate-500 mt-1">ตรวจแล้ว</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div>
        <div class="flex justify-between items-center text-sm mb-2">
          <span class="font-medium text-slate-700">ความคืบหน้าการตรวจสอบ</span>
          <span id="progressPercent" class="font-prompt font-semibold text-slate-900">0%</span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-blue-600 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <label class="font-prompt font-semibold text-slate-800 text-base">รายการ TOR</label>
        <div class="flex flex-col sm:flex-row gap-2 sm:items-center flex-1 sm:max-w-md">
          <div class="relative flex-1">
            <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="ค้นหารหัสหรือข้อความ..." 
              class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
          </div>
          <select id="statusFilter" class="px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="all">ทั้งหมด</option>
            <option value="pending">ยังไม่ตรวจ</option>
            <option value="ผ่าน">ผ่าน</option>
            <option value="ไม่ผ่าน">ไม่ผ่าน</option>
          </select>
        </div>
      </div>

      <!-- TOR List Container -->
      <div id="torListContainer" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
        <!-- Loading Skeleton -->
        <div class="text-center py-8 text-slate-400 text-sm">
          <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent mb-2"></div>
          <div>กำลังโหลดข้อมูลจาก Google Sheets...</div>
        </div>
      </div>
    </div>

    <!-- Active TOR Inspection Card -->
    <div id="detailCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 hidden">
      <!-- Top Header -->
      <div class="flex items-start justify-between gap-3 mb-2">
        <h2 id="detailTorId" class="font-prompt text-lg sm:text-xl font-bold text-slate-900">TOR -</h2>
        <span id="detailIndexBadge" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 shrink-0">0 / 0</span>
      </div>
      <p id="detailDescription" class="text-slate-700 text-base leading-relaxed mb-5">-</p>

      <!-- Evidence Header -->
      <div class="flex items-center justify-between text-sm mb-3">
        <span class="font-prompt font-semibold text-slate-800">หลักฐานประกอบ</span>
        <span id="detailImageCount" class="text-slate-500">0 รูป</span>
      </div>

      <!-- Image Viewer Box -->
      <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 mb-4">
        <div id="imageViewerContainer" class="relative min-h-[260px] sm:min-h-[380px] flex flex-col items-center justify-center bg-white rounded-xl border border-slate-100 overflow-hidden">
          <!-- Image or Placeholder injected by JS -->
        </div>

        <!-- Image Info & Controls -->
        <div class="mt-4 flex flex-col items-center">
          <div class="flex items-center gap-2 mb-3">
            <span id="currentImageName" class="font-prompt font-medium text-sm text-slate-800">-</span>
            <a id="btnOpenOriginal" href="#" target="_blank" class="hidden text-xs text-blue-600 hover:underline" title="เปิดไฟล์ต้นฉบับใน Google Drive">
              <i class="bi bi-box-arrow-up-right"></i> เปิดใน Drive
            </a>
          </div>

          <div class="flex items-center gap-3">
            <button id="btnPrevImg" onclick="changeImage(-1)" class="inline-flex items-center gap-1 px-4 py-1.5 rounded-full border border-slate-200 bg-white text-sm text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none transition">
              <i class="bi bi-chevron-left text-xs"></i> รูปก่อนหน้า
            </button>
            <span id="imagePagination" class="text-sm font-medium text-slate-600 min-w-[40px] text-center">0/0</span>
            <button id="btnNextImg" onclick="changeImage(1)" class="inline-flex items-center gap-1 px-4 py-1.5 rounded-full border border-slate-200 bg-white text-sm text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none transition">
              รูปถัดไป <i class="bi bi-chevron-right text-xs"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Evaluation Form -->
      <div class="mt-6">
        <label class="block font-prompt font-semibold text-sm text-slate-800 mb-3">ผลการตรวจสอบ</label>
        
        <div class="grid grid-cols-2 gap-3 mb-3">
          <button type="button" id="btnPass" onclick="selectStatus('ผ่าน')" 
            class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-full border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
            <i class="bi bi-check-circle text-base"></i> ผ่าน
          </button>
          <button type="button" id="btnFail" onclick="selectStatus('ไม่ผ่าน')" 
            class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-full border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
            <i class="bi bi-x-circle text-base"></i> ไม่ผ่าน
          </button>
        </div>

        <textarea id="remarkInput" rows="3" placeholder="บันทึกข้อสังเกตหรือสิ่งที่ต้องแก้ไข..." 
          class="w-full p-3.5 text-sm border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 mb-4"></textarea>

        <!-- Save & Navigation Actions -->
        <div class="flex flex-col sm:flex-row items-center gap-3">
          <button type="button" id="btnPrevTor" onclick="navigateTor(-1)" 
            class="w-full sm:w-auto flex-1 flex items-center justify-center gap-2 py-2.5 px-5 rounded-full border border-slate-200 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40 transition">
            <i class="bi bi-arrow-left"></i> ข้อก่อนหน้า
          </button>
          
          <button type="button" id="btnSaveAndNext" onclick="saveCurrentAndNext()" 
            class="w-full sm:w-auto flex-[2] flex items-center justify-center gap-2 py-2.5 px-6 rounded-full bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 transition shadow-sm">
            <span id="saveBtnText">บันทึกและไปข้อถัดไป</span> <i class="bi bi-arrow-right"></i>
          </button>
        </div>

        <div id="lastUpdatedText" class="text-xs text-slate-400 text-center mt-3">
          ข้อมูลจะถูกบันทึกลง Google Sheets ทันทีเมื่อกดปุ่มบันทึก
        </div>
      </div>
    </div>

  </div>

  <!-- Fullscreen Image Zoom Modal -->
  <div id="imageModal" class="fixed inset-0 z-50 bg-black/85 hidden items-center justify-center p-4" onclick="closeModal()">
    <button class="absolute top-4 right-4 text-white/80 hover:text-white text-3xl" onclick="closeModal()">
      <i class="bi bi-x-lg"></i>
    </button>
    <img id="modalImg" src="" alt="Preview" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain" onclick="event.stopPropagation()">
  </div>

  <script src="app.js"></script>
</body>
</html>
